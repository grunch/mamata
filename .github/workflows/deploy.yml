# Build y publicación en GitHub Pages (mamata.live).
# Solo el código: el contenido viaja por Nostr y no pasa por GitHub.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Por defecto nada; cada job pide solo lo que usa.
permissions: {}

# Un despliegue a la vez; si se suben dos cambios seguidos, gana el último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
